apiVersion: apps/v1
kind: Deployment
metadata:
  name: delap
  labels: { app: delap }
spec:
  replicas: 2
  selector:
    matchLabels: { app: delap }
  template:
    metadata:
      labels: { app: delap }
    spec:
      containers:
        - name: web
          # Image construite au TP4 et chargée dans kind (kind load docker-image delap:local)
          image: delap:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
