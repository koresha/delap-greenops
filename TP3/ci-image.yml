# Bonus du TP3 : construire l'image Docker et la pousser sur GHCR
# À copier dans .github/workflows/ci-image.yml
name: Image

on:
  push:
    branches: [main]

# Seul ce workflow a le droit d'écrire des paquets
permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/login-action@9780b0c442fbb1933fd8ba5d7f3d0f7d3ad3e5a0 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: docker build -t ghcr.io/${{ github.repository }}:latest .
      - name: Push
        run: docker push ghcr.io/${{ github.repository }}:latest
