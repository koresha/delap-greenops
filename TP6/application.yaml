apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: delap
  namespace: argocd
spec:
  project: default
  source:
    # Remplacez <COMPTE> par votre compte GitHub (votre fork)
    repoURL: https://github.com/<COMPTE>/delap-greenops.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: delap
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
