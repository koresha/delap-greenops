# Corrigé du TP3 : à copier dans .github/workflows/ci.yml
name: CI

on: [push, pull_request]

# Règle 1 : permissions minimales. Le jeton ne peut que lire le code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Règle 2 : actions épinglées par SHA (le commentaire garde la version lisible)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
      - name: Tests
        run: node tests/greenops.test.js

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # tout l'historique, sinon gitleaks ne voit que le dernier commit
      # Règle 4 : contrôle bloquant. Gitleaks sort en erreur s'il trouve un secret.
      # Lancé via Docker : pas d'action tierce dans le pipeline.
      - name: Gitleaks
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo
