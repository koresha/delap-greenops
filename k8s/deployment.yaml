apiVersion: apps/v1
kind: Deployment
metadata:
  name: delap
  labels: { app: delap }
spec:
  replicas: 2
  selector:
    matchLabels: { app: delap }
  template:
    metadata:
      labels: { app: delap }
    spec:
      containers:
        - name: web
          image: ghcr.io/koresha/delap-greenops:latest
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
